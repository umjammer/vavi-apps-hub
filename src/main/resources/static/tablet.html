<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hub Tablet</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #1e1f22; color: #ccc; font: 13px -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #surface {
    position: fixed; inset: 0; width: 100%; height: 100%;
    touch-action: none; display: block;
  }
  #bar {
    position: fixed; top: env(safe-area-inset-top, 0); right: 0; left: 0;
    display: flex; gap: 8px; align-items: center; justify-content: flex-end;
    padding: 6px 10px; pointer-events: none;
  }
  #bar > * { pointer-events: auto; }
  #status { margin-right: auto; opacity: .7; }
  #status.ok::before { content: "● "; color: #4caf50; }
  #status.ng::before { content: "● "; color: #f44336; }
  button, label.chip {
    background: #2b2d31; color: #ddd; border: 1px solid #444; border-radius: 6px;
    padding: 6px 10px; font: inherit; touch-action: manipulation;
  }
  button.on { background: #3d6bd6; border-color: #3d6bd6; color: #fff; }
  input[type=range] { width: 90px; vertical-align: middle; }
</style>
</head>
<body>
<canvas id="surface"></canvas>
<div id="bar">
  <span id="status" class="ng">connecting…</span>
  <label class="chip">curve <input id="gamma" type="range" min="0.3" max="3" step="0.1" value="1"> <span id="gammaV">1.0</span></label>
  <button id="right" title="next stroke is a right click">R-click</button>
  <button id="finger" title="also accept finger as a pen without pressure">finger</button>
  <button id="ink" class="on" title="show local ink preview">ink</button>
</div>
<script>
(() => {
  "use strict";

  const surface = document.getElementById("surface");
  const ctx = surface.getContext("2d");
  const statusEl = document.getElementById("status");

  // ---- settings (per device convenience only)
  const store = {
    get(k, d) { try { const v = localStorage.getItem("hub.tablet." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("hub.tablet." + k, JSON.stringify(v)); } catch (e) { /* ignore */ } }
  };
  let gamma = store.get("gamma", 1);
  let acceptFinger = store.get("finger", false);
  let showInk = store.get("ink", true);
  let rightOnce = false;

  const gammaEl = document.getElementById("gamma");
  const gammaV = document.getElementById("gammaV");
  gammaEl.value = gamma; gammaV.textContent = (+gamma).toFixed(1);
  gammaEl.addEventListener("input", () => { gamma = +gammaEl.value; gammaV.textContent = gamma.toFixed(1); store.set("gamma", gamma); });

  const toggle = (id, get, set) => {
    const el = document.getElementById(id);
    const sync = () => el.classList.toggle("on", get());
    el.addEventListener("click", () => { set(!get()); sync(); });
    sync();
    return { el, sync };
  };
  toggle("finger", () => acceptFinger, v => { acceptFinger = v; store.set("finger", v); });
  toggle("ink", () => showInk, v => { showInk = v; store.set("ink", v); if (!v) clearInk(); });
  const rightBtn = toggle("right", () => rightOnce, v => { rightOnce = v; });

  // ---- websocket
  let ws;
  let retry = 500;
  function connect() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(proto + "//" + location.host + "/ws/tablet");
    ws.onopen = () => { retry = 500; statusEl.className = "ok"; statusEl.textContent = location.host; hello(); };
    ws.onclose = () => {
      statusEl.className = "ng"; statusEl.textContent = "disconnected, retrying…";
      setTimeout(connect, retry); retry = Math.min(retry * 2, 5000);
    };
    ws.onerror = () => ws.close();
  }
  function send(o) {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify(o));
  }
  function hello() { send({ t: "hello", w: surface.clientWidth, h: surface.clientHeight }); }

  // ---- surface size
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    surface.width = Math.round(surface.clientWidth * dpr);
    surface.height = Math.round(surface.clientHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    hello();
  }
  window.addEventListener("resize", resize);
  resize();

  // ---- pen sample
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function tilt(e) {
    let tx = e.tiltX, ty = e.tiltY;
    if ((tx == null || ty == null || (tx === 0 && ty === 0)) && e.altitudeAngle != null && e.azimuthAngle != null && e.altitudeAngle < Math.PI / 2) {
      // spherical -> tiltX/Y (degrees)
      const tanAlt = Math.tan(e.altitudeAngle);
      tx = Math.atan(Math.cos(e.azimuthAngle) / tanAlt) * 180 / Math.PI;
      ty = Math.atan(Math.sin(e.azimuthAngle) / tanAlt) * 180 / Math.PI;
    }
    return [clamp((tx || 0) / 90, -1, 1), clamp((ty || 0) / 90, -1, 1)];
  }

  function sample(t, e, button) {
    const r = surface.getBoundingClientRect();
    const [tx, ty] = tilt(e);
    let p = e.pointerType === "pen" ? e.pressure : (e.buttons ? 0.5 : 0);
    if (t === "down" && e.pointerType === "pen" && p === 0) p = 0.01;
    p = Math.pow(clamp(p, 0, 1), gamma);
    return {
      t,
      x: (e.clientX - r.left) / r.width,
      y: (e.clientY - r.top) / r.height,
      p: Math.round(p * 10000) / 10000,
      tx: Math.round(tx * 1000) / 1000,
      ty: Math.round(ty * 1000) / 1000,
      r: e.twist || 0,
      b: button
    };
  }

  // ---- local ink preview (fades out)
  let strokes = [];
  function clearInk() { strokes = []; ctx.clearRect(0, 0, surface.clientWidth, surface.clientHeight); }
  function addInk(s, x, y, p) {
    if (!showInk) return;
    s.points.push({ x, y, p });
    s.time = performance.now();
  }
  function render() {
    const now = performance.now();
    ctx.clearRect(0, 0, surface.clientWidth, surface.clientHeight);
    strokes = strokes.filter(s => s.active || now - s.time < 1500);
    for (const s of strokes) {
      const alpha = s.active ? 1 : 1 - (now - s.time) / 1500;
      ctx.strokeStyle = s.button ? `rgba(255,140,80,${alpha})` : `rgba(220,220,220,${alpha})`;
      ctx.lineCap = "round";
      for (let i = 1; i < s.points.length; i++) {
        const a = s.points[i - 1], b = s.points[i];
        ctx.lineWidth = 0.5 + b.p * 6;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  // ---- pointer handling
  let activeId = null;   // pointer id of the current stroke
  let button = 0;
  let stroke = null;
  let hoverSeen = false; // device sends hover (e.g. Pencil Pro / M2 iPad Pro)

  const accepted = e => e.pointerType === "pen" || (acceptFinger && e.pointerType !== "pen");

  surface.addEventListener("pointerdown", e => {
    if (!accepted(e) || activeId !== null) return;
    e.preventDefault();
    surface.setPointerCapture(e.pointerId);
    activeId = e.pointerId;
    button = rightOnce ? 1 : 0;
    if (rightOnce) { rightOnce = false; rightBtn.sync(); }
    const s = sample("down", e, button);
    send(s);
    stroke = { points: [], active: true, button, time: performance.now() };
    strokes.push(stroke);
    addInk(stroke, e.clientX, e.clientY, s.p);
  });

  surface.addEventListener("pointermove", e => {
    if (!accepted(e)) return;
    e.preventDefault();
    if (activeId === null) {
      if (e.pointerType === "pen") { // hover
        hoverSeen = true;
        send(sample("hover", e, 0));
      }
      return;
    }
    if (e.pointerId !== activeId) return;
    const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ce of (events.length ? events : [e])) {
      const s = sample("move", ce, button);
      send(s);
      addInk(stroke, ce.clientX, ce.clientY, s.p);
    }
  });

  function end(e) {
    if (e.pointerId !== activeId) return;
    e.preventDefault();
    send(sample("up", e, button));
    if (!hoverSeen || e.pointerType !== "pen") send({ t: "leave", x: -1, y: -1 });
    activeId = null;
    if (stroke) { stroke.active = false; stroke.time = performance.now(); stroke = null; }
  }
  surface.addEventListener("pointerup", end);
  surface.addEventListener("pointercancel", end);
  surface.addEventListener("pointerleave", e => {
    if (e.pointerType === "pen" && activeId === null) send({ t: "leave", x: -1, y: -1 });
  });

  // ---- kill safari gestures (scroll, zoom, loupe, callout, scribble)
  const kill = e => { if (e.target === surface) e.preventDefault(); };
  ["touchstart", "touchmove", "touchend"].forEach(t => document.addEventListener(t, kill, { passive: false }));
  ["gesturestart", "gesturechange", "gestureend", "contextmenu", "selectstart", "dblclick"].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));

  connect();
})();
</script>
</body>
</html>
